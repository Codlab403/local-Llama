version: '3.8'
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.74.0
    container_name: otel-collector
    volumes:
      - ./backend/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config", "/etc/otel/config.yaml"]
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped
